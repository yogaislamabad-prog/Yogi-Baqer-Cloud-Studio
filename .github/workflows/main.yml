name: Yogi Baqer 10-Agent Cloud Video Pipeline

on:
  workflow_dispatch:
    inputs:
      project_id:
        description: 'Project ID from Google Sheet (e.g. Video_01)'
        required: true
        default: 'Video_01'
      input_video_url:
        description: 'Google Drive / Direct Link to Raw Video (Optional)'
        required: false
        default: ''

jobs:
  run-10-agents-cloud:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: 1. Checkout Yogi Baqer Cloud Repository
        uses: actions/checkout@v4

      - name: 2. Install Cloud System Dependencies (FFmpeg & Fonts)
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-dejavu-core fonts-liberation

      - name: 3. Set Up Python 3.11 on Cloud Server
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: 4. Install Whisper Flow, Pillow (HyperFrames) & Agent Libraries
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: 5. Execute All 10 Agents + Whisper Flow + HyperFrames on Cloud
        env:
          PROJECT_ID: ${{ github.event.inputs.project_id || 'Video_01' }}
          INPUT_VIDEO_URL: ${{ github.event.inputs.input_video_url || '' }}
        run: |
          python cloud_orchestrator.py --project-id "$PROJECT_ID" --video-url "$INPUT_VIDEO_URL"

      - name: 6. Upload Final Rendered MP4, HyperFrames & CapCut Draft Zip
        uses: actions/upload-artifact@v4
        with:
          name: Yogi_Baqer_Cloud_Output_${{ github.event.inputs.project_id || 'Video_01' }}
          path: |
            cloud_output/**
          retention-days: 14
